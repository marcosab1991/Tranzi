<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaVLC - Kiosk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* No scrollbars */
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        header {
            height: 100px;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-logo img {
            max-height: 70px;
            border-radius: 8px;
        }
        .header-logo h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .clock {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }
        
        /* Main Layout */
        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 100px);
        }
        .stops-area {
            flex: 2;
            padding: 40px;
            display: grid;
            align-content: start;
            gap: 24px;
            overflow: hidden;
        }
        .promos-area {
            flex: 1;
            background: #000;
            position: relative;
        }
        
        /* Stop Cards */
        .stop-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .stop-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 16px;
        }
        .stop-badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.5rem;
        }
        .badge-bus { background: #ef4444; color: white; }
        .badge-metro { background: #3b82f6; color: white; }
        .badge-tram { background: #f97316; color: white; }
        .badge-metrobus { background: #FFB81C; color: black; }
        
        .stop-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        
        .arrivals-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .arrival-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 600;
            width: 100%;
        }
        .arrival-line {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0; /* allows flex children to truncate */
            margin-right: 12px;
        }
        .line-box {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
            flex-shrink: 0;
        }
        .arrival-dest {
            color: var(--text-dim);
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .arrival-time {
            font-size: 1.5rem;
            font-weight: 800;
            color: #10b981; /* Green for times */
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        
        /* Dynamic Scaling for Fewer Stops */
        .stops-count-1 { grid-template-columns: 1fr; }
        .stops-count-1 .stop-name { font-size: 2.5rem; }
        .stops-count-1 .arrival-row { font-size: 2rem; margin-bottom: 8px; }
        .stops-count-1 .arrival-dest { font-size: 1.8rem; }
        .stops-count-1 .arrival-time { font-size: 2.5rem; }
        
        .stops-count-2 { grid-template-columns: repeat(2, 1fr); }
        .stops-count-2 .stop-name { font-size: 1.8rem; }
        .stops-count-2 .arrival-row { font-size: 1.5rem; margin-bottom: 6px; }
        .stops-count-2 .arrival-dest { font-size: 1.4rem; }
        .stops-count-2 .arrival-time { font-size: 1.8rem; }
        
        .stops-count-3 { grid-template-columns: repeat(3, 1fr); }
        .stops-count-3 .stop-name { font-size: 1.5rem; }
        .stops-count-3 .arrival-row { font-size: 1.25rem; margin-bottom: 4px; }
        .stops-count-3 .arrival-dest { font-size: 1.2rem; }
        .stops-count-3 .arrival-time { font-size: 1.5rem; }
        
        /* 4 Stops (2x2 grid) */
        .stops-count-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); align-content: stretch; }
        .stops-count-4 .stop-card { padding: 16px; gap: 8px; }
        .stops-count-4 .stop-name { font-size: 1.3rem; }
        .stops-count-4 .arrival-row { font-size: 1.1rem; margin-bottom: 4px; }
        .stops-count-4 .arrival-dest { font-size: 1.1rem; }
        .stops-count-4 .arrival-time { font-size: 1.3rem; }
        .stops-count-4 .line-box { padding: 4px 10px; min-width: 40px; font-size: 1rem; }
        
        /* 5 or 6 Stops (3x2 grid) */
        .stops-count-more { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); align-content: stretch; gap: 12px; padding: 20px; }
        .stops-count-more .stop-card { padding: 12px; gap: 8px; }
        .stops-count-more .stop-name { font-size: 1.1rem; }
        .stops-count-more .arrival-row { font-size: 0.95rem; margin-bottom: 2px; }
        .stops-count-more .arrival-dest { font-size: 0.95rem; }
        .stops-count-more .arrival-time { font-size: 1.1rem; }
        .stops-count-more .line-box { padding: 2px 8px; min-width: 35px; font-size: 0.8rem; }
        
        /* Promos Slider */
        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            object-fit: contain; /* Don't crop, show full promo */
        }
        .slide.active {
            opacity: 1;
        }
        
        /* Error Screen */
        #error-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            display: none;
        }
        #error-screen h1 { font-size: 3rem; margin-bottom: 20px; }
        #error-screen p { font-size: 1.5rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="error-screen">
        <h1>Quiosque Inativo</h1>
        <p>Por favor, contacte o suporte ou verifique a configuração.</p>
    </div>

    <header>
        <div class="header-logo">
            <img id="kiosk-logo" src="" alt="Logo" style="display:none;">
            <h1 id="kiosk-name">Carregando...</h1>
        </div>
        <div class="clock" id="clock">00:00</div>
    </header>

    <div class="main-content">
        <div class="stops-area" id="stops-container">
            <!-- Stops will be injected here -->
        </div>
        
        <div class="promos-area" id="promos-container">
            <!-- Promo images will be injected here -->
        </div>
    </div>

    <script>
        const slug = window.location.pathname.split('/').pop();
        let kioskConfig = null;
        
        // Clock Update
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Init Kiosk
        async function initKiosk() {
            try {
                const res = await fetch(`/api/kiosk/${slug}`);
                if(!res.ok) {
                    showError();
                    return;
                }
                kioskConfig = await res.json();
                setupUI();
                fetchETAs();
                setInterval(fetchETAs, 30000); // 30s auto-refresh
            } catch(e) {
                showError();
            }
        }
        
        function showError() {
            document.getElementById('error-screen').style.display = 'flex';
        }
        
        function setupUI() {
            document.getElementById('kiosk-name').innerText = kioskConfig.name;
            if(kioskConfig.logo_url) {
                const img = document.getElementById('kiosk-logo');
                img.src = kioskConfig.logo_url;
                img.style.display = 'block';
            }
            
            // Setup Promos Slider
            const promosContainer = document.getElementById('promos-container');
            if(kioskConfig.promotional_images && kioskConfig.promotional_images.length > 0) {
                kioskConfig.promotional_images.forEach((url, i) => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'slide' + (i === 0 ? ' active' : '');
                    promosContainer.appendChild(img);
                });
                
                if(kioskConfig.promotional_images.length > 1) {
                    let currentSlide = 0;
                    const slides = document.querySelectorAll('.slide');
                    setInterval(() => {
                        slides[currentSlide].classList.remove('active');
                        currentSlide = (currentSlide + 1) % slides.length;
                        slides[currentSlide].classList.add('active');
                    }, 10000); // Rotate every 10s
                }
            } else {
                promosContainer.style.display = 'none'; // No promos
            }
        }
        
        async function fetchETAs() {
            if(!kioskConfig || !kioskConfig.stops) return;
            
            const container = document.getElementById('stops-container');
            
            // Apply a dynamic class based on the number of stops to scale CSS
            let numStops = kioskConfig.stops.length;
            let classSuffix = numStops;
            if (numStops >= 5) classSuffix = 'more';
            container.className = 'stops-area stops-count-' + classSuffix;
            
            // Fixed max arrivals based on stop count to ensure predictable fitting
            let maxArrivals = 4;
            if (numStops === 1) maxArrivals = 8;
            else if (numStops === 2) maxArrivals = 6;
            else if (numStops === 3) maxArrivals = 5;
            else if (numStops === 4) maxArrivals = 4;
            else maxArrivals = 3;
            
            let html = '';
            
            for(const stop of kioskConfig.stops) {
                try {
                    const res = await fetch(`/api/eta?id=${stop.id}&type=${stop.type}`);
                    const data = await res.json();
                    
                    let arrivalsHTML = '';
                    if(data.success && data.data.length > 0) {
                        arrivalsHTML = data.data.slice(0, maxArrivals).map(arr => {
                            let displayEta = arr.eta;
                            if (displayEta.includes(':')) {
                                const parts = displayEta.split(':');
                                if (parts.length >= 2) {
                                    const now = new Date();
                                    const h = parseInt(parts[0]);
                                    const m = parseInt(parts[1]);
                                    let waitMins = (h - now.getHours()) * 60 + (m - now.getMinutes());
                                    if (waitMins < -12 * 60) waitMins += 24 * 60;
                                    else if (waitMins < 0 && waitMins > -12 * 60) waitMins = 0;
                                    displayEta = `${waitMins} min`;
                                }
                            } else if (displayEta.match(/^\d+$/) || displayEta.match(/^\d+\s*min/)) {
                                const m = displayEta.match(/\d+/);
                                if (m) displayEta = `${m[0]} min`;
                            }
                            
                            return `
                            <div class="arrival-row">
                                <div class="arrival-line">
                                    <div class="line-box">${arr.line}</div>
                                    <span class="arrival-dest">${arr.destination}</span>
                                </div>
                                <div class="arrival-time">${displayEta}</div>
                            </div>
                            `;
                        }).join('');
                    } else {
                        arrivalsHTML = '<div class="arrival-row" style="color:var(--text-dim);">Sem informações de chegada</div>';
                    }
                    
                    html += `
                        <div class="stop-card">
                            <div class="stop-header">
                                <span class="stop-badge ${stop.badgeClass}">${stop.badgeText}</span>
                                <h2 class="stop-name">${stop.name}</h2>
                            </div>
                            <div class="arrivals-list">
                                ${arrivalsHTML}
                            </div>
                        </div>
                    `;
                } catch(e) {
                    console.error("Error fetching ETA for", stop.id);
                }
            }
            
            container.innerHTML = html;
        }
        
        initKiosk();
    </script>
</body>
</html>
